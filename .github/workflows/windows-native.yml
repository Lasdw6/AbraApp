name: Desktop builds
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            command: npm run build:windows
            artifact: Abra-Teleport-Windows-native-x64
            file: desktop/dist/windows-native/*-Setup.exe
          - os: macos-15
            command: npm run build
            artifact: Abra-Teleport-mac-arm64
            file: desktop/dist/Abra-Teleport-mac-arm64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: npm ci
      - run: npm run check
      - run: ${{ matrix.command }}
      - name: Check the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/dist/windows-native/*-Setup.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'Abra installed test'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          if (!(Test-Path (Join-Path $destination 'Abra Teleport.exe'))) { throw 'Installed app is missing' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          & (Join-Path $destination 'Abra Teleport.exe') -e "console.log(process.versions.node)"
          if ($LASTEXITCODE -ne 0) { throw 'Installed Node runtime did not start' }
          & (Join-Path $destination 'resources/Runtime/abra.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed Abra runtime did not start' }
          $core = Join-Path $destination 'resources/Runtime/abra.exe'
          $root = Join-Path $env:RUNNER_TEMP 'abra smoke state'
          try {
            & $core --root $root --json daemon --background --yes --transport tcp | ConvertFrom-Json | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Installed daemon did not start' }
          } finally {
            & $core --root $root --json stop | ConvertFrom-Json | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Installed daemon did not stop' }
          }
      - name: Check and zip the Mac app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="desktop/dist/mac-arm64/Abra Teleport.app"
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/Abra Teleport" -e 'console.log(process.versions.node)'
          "$app/Contents/Resources/Runtime/abra" --version
          ditto -c -k --sequesterRsrc --keepParent "$app" desktop/dist/Abra-Teleport-mac-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error
