name: Windows installer diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: Abra-Teleport-Windows-native-x64
          run-id: 34059133524
          github-token: ${{ github.token }}
          path: installer
      - name: Install
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer/*-Setup.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'Abra installed test'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          "ABRA_INSTALL_DIR=$destination" >> $env:GITHUB_ENV
      - name: Diagnose installed runtime
        run: node scripts/diagnose-installed.cjs
